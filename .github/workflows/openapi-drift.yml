name: OpenAPI Drift Check
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Regenerate OpenAPI spec
        run: npm run generate:openapi
      - name: Fail if spec is out of sync
        run: git diff --exit-code docs/openapi.yaml || (echo "❌ OpenAPI spec is out of sync. Run 'npm run generate:openapi' locally and commit the result." && exit 1)
      - name: Check for route drift
        run: npm run openapi:check
