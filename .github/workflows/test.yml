name: Integration Tests

on:
  push:
    branches: [main, develop, test/repository-integration-tests, feature/prometheus-metrics]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: credence_test
          POSTGRES_USER: credence
          POSTGRES_PASSWORD: credence
        options: >-
          --health-cmd "pg_isready -U credence -d credence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U credence; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests with coverage
        env:
          NODE_ENV: test
          PORT: 3000
          DB_URL: postgresql://credence:credence@localhost:5432/credence_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-key-for-ci-testing-only-min-32-chars
          JWT_EXPIRY: 1h
          ENABLE_TRUST_SCORING: false
          ENABLE_BOND_EVENTS: false
          CORS_ORIGIN: "*"
          LOG_LEVEL: error
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage/lcov.info
          flags: integration
          name: integration-tests
          fail_ci_if_error: false
        continue-on-error: true
