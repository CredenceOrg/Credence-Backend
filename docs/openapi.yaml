      security:
        - bearerAuth: []
      responses:
        "200":
          description: Feature flag list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagListResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
    post:
      summary: Create a feature flag
      description: Creates a new feature flag. The flag key must be unique across the
        system.
      tags:
        - Feature Flags
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlagBody"
      responses:
        "201":
          description: Feature flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponseEnvelope"
        "400":
          description: Validation error (e.g. invalid key format, rolloutPercent out of
            range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
  /api/admin/feature-flags/{key}:
    put:
      summary: Update a feature flag
      description: Updates one or more fields on an existing feature flag. All fields
        are optional.
      tags:
        - Feature Flags
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z0-9_-]+$
            description: Unique flag identifier (slug)
            example: new-scoring-weights
          required: true
          description: Unique flag identifier (slug)
          name: key
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlagBody"
      responses:
        "200":
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponseEnvelope"
        "400":
          description: Validation error or no fields provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "404":
          description: Feature flag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
  /api/admin/feature-flags/{key}/overrides:
    post:
      summary: Set a per-tenant boolean override
      description: Creates or updates a boolean on/off override for a specific tenant.
        A boolean override always takes the highest precedence, superseding any
        per-tenant rollout or global rollout.
      tags:
        - Feature Flags
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z0-9_-]+$
            description: Unique flag identifier (slug)
            example: new-scoring-weights
          required: true
          description: Unique flag identifier (slug)
          name: key
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOverrideBody"
      responses:
        "201":
          description: Override created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideResponseEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "404":
          description: Feature flag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
  /api/admin/feature-flags/{key}/overrides/{tenantId}:
    delete:
      summary: Remove a per-tenant boolean override
      description: Removes a boolean override for a specific tenant. After removal the
        tenant falls back to per-tenant rollout (if configured), global rollout,
        or defaultEnabled.
      tags:
        - Feature Flags
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z0-9_-]+$
            description: Unique flag identifier (slug)
            example: new-scoring-weights
          required: true
          description: Unique flag identifier (slug)
          name: key
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 256
            description: Tenant identifier
            example: tenant-abc
          required: true
          description: Tenant identifier
          name: tenantId
          in: path
      responses:
        "200":
          description: Override removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "404":
          description: Override not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
