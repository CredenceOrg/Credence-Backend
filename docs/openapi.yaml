          type: string
          example: v20.10.0
      required:
        - service
        - gitSha
        - buildTimestamp
        - nodeVersion
    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Wallet UUID (auto-generated by Postgres)
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        address:
          type: string
          minLength: 1
          description: Blockchain wallet address
          example: 0xTestAddress1
        balance:
          type: string
          description: Current balance as a decimal string (NUMERIC(36,18))
          example: "100.000000000000000000"
        currency:
          type: string
          description: Currency code
          example: USD
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the wallet was created
        updatedAt:
          type: string
          format: date-time
          description: UTC timestamp of the last balance change
      required:
        - id
        - address
        - balance
        - currency
        - createdAt
        - updatedAt
    WalletError:
      type: object
      properties:
        error:
          type: string
          example: Wallet abc not found
      required:
        - error
    CreateWalletBody:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          description: Blockchain wallet address (must be unique)
          example: 0xNewAddress
        initialBalance:
          type: string
          description: Optional initial balance as a decimal string. Defaults to "0".
          example: "50"
        currency:
          type: string
          description: Currency code. Defaults to "USD".
          example: USD
      required:
        - address
    WalletDebitResponse:
      type: object
      properties:
        wallet:
          $ref: "#/components/schemas/Wallet"
        previousBalance:
          type: string
          description: Wallet balance before the debit
          example: "100.000000000000000000"
        newBalance:
          type: string
          description: Wallet balance after the debit
          example: "74.500000000000000000"
        debitedAmount:
          type: string
          description: Amount that was debited
          example: "25.50"
      required:
        - wallet
        - previousBalance
        - newBalance
        - debitedAmount
    WalletDebitBody:
      type: object
      properties:
        amount:
          type: string
          minLength: 1
          description: Positive decimal string amount to deduct from the wallet balance.
          example: "25.50"
      required:
        - amount
    BondResponse:
      type: object
      properties:
        address:
          type: string
          description: Normalised (lower-case) wallet address
          example: "0x742d35cc6634c0532925a3b844bc454e4438f44e"
        bondedAmount:
          type: string
          description: Current bonded amount as a string
          example: "1000000000000000000"
        bondStart:
          type: string
          nullable: true
          description: ISO 8601 timestamp when the bond was first posted, or null
          example: 2024-01-15T10:00:00.000Z
        bondDuration:
          type: number
          nullable: true
          description: Bond lock duration in seconds, or null if unbonded
          example: 2592000
        active:
          type: boolean
          description: "Deprecated: use `status` instead"
          example: true
        slashedAmount:
          type: string
          description: Cumulative slashed amount as a string
          example: "0"
        status:
          type: string
          enum:
            - active
            - slashed
            - inactive
            - unbonded
          description: Canonical bond lifecycle status
          example: active
      required:
        - address
        - bondedAmount
        - bondStart
        - bondDuration
        - active
        - slashedAmount
        - status
    BondError:
      type: object
      properties:
        error:
          type: string
          example: No bond record found for address 0x…
      required:
        - error
    CreateBondBody:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          description: Wallet address to associate the bond with
          example: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
        bondedAmount:
          type: string
          minLength: 1
          description: Amount to bond, expressed as a string to preserve precision (e.g.
            wei)
          example: "1000000000000000000"
        bondDuration:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: Bond lock duration in seconds
          example: 2592000
      required:
        - address
        - bondedAmount
        - bondDuration
    SlashRequest:
      type: object
      properties:
        id:
          type: string
          example: a1b2c3d4e5f6a7b8
        targetAddress:
          type: string
          example: GDUKMGUGDZQK6YHYA5Z6AY2G4XDSZPSZ3SW5UN3ARVMO6QSRDWP5YLEX
        reason:
          type: string
          example: Repeated SLA violations on delivery commitments
        requestedBy:
          type: string
          example: validator-12
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T09:00:00.000Z
        votes:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        status:
          $ref: "#/components/schemas/SlashRequestStatus"
        threshold:
          type: integer
          example: 3
        totalSigners:
          type: integer
          example: 5
      required:
        - id
        - targetAddress
        - reason
        - requestedBy
        - createdAt
        - votes
        - status
        - threshold
        - totalSigners
    Vote:
      type: object
      properties:
        voterId:
          type: string
          example: validator-3
        choice:
          $ref: "#/components/schemas/VoteChoice"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp the vote was cast
          example: 2024-01-15T10:00:00.000Z
      required:
        - voterId
        - choice
        - timestamp
    VoteChoice:
      type: string
      enum:
        - approve
        - reject
    SlashRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    GovernanceError:
      type: object
      properties:
        error:
          type: string
          example: NotFound
        message:
          type: string
          example: Slash request not found
      required:
        - error
        - message
    CreateSlashRequestBody:
      type: object
      properties:
        targetAddress:
          type: string
          minLength: 1
          description: On-chain address of the entity being slashed
          example: GDUKMGUGDZQK6YHYA5Z6AY2G4XDSZPSZ3SW5UN3ARVMO6QSRDWP5YLEX
        reason:
          type: string
          minLength: 1
          description: Reason for requesting the slash
          example: Repeated SLA violations on delivery commitments
        requestedBy:
          type: string
          minLength: 1
          description: Identifier of the requester
          example: validator-12
        threshold:
          type: integer
          minimum: 1
          description: "Approve votes required to pass (default: 3)"
          example: 3
        totalSigners:
          type: integer
          minimum: 1
          description: "Total eligible signers (default: 5)"
          example: 5
      required:
        - targetAddress
        - reason
        - requestedBy
    SlashRequestsListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/SlashRequest"
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
        hasNext:
          type: boolean
          example: false
      required:
        - success
        - data
        - page
        - limit
        - total
        - hasNext
    VoteResult:
      type: object
      properties:
        slashRequestId:
          type: string
          example: a1b2c3d4e5f6a7b8
        voterId:
          type: string
          example: validator-3
        choice:
          $ref: "#/components/schemas/VoteChoice"
        approveCount:
          type: integer
          example: 2
        rejectCount:
          type: integer
          example: 0
        status:
          $ref: "#/components/schemas/SlashRequestStatus"
      required:
        - slashRequestId
        - voterId
        - choice
        - approveCount
        - rejectCount
        - status
    SubmitVoteBody:
      type: object
      properties:
        voterId:
          type: string
          minLength: 1
          example: validator-3
        choice:
          $ref: "#/components/schemas/VoteChoice"
      required:
        - voterId
        - choice
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 5f8d0d55-1c1b-4e9a-9b1a-4e6f6f6f6f6f
        filedBy:
          type: string
          example: GDUKMGUGDZQK6YHYA5Z6AY2G4XDSZPSZ3SW5UN3ARVMO6QSRDWP5YLEX
        respondent:
          type: string
          example: GBVFLWXYZ6JJ7TUSU6QDJ6DOY4J5G5VHGJWSCMHL7QSAHRDEQU3EXFW2
        reason:
          type: string
          example: Goods delivered did not match the agreed specification
        evidence:
          type: array
          items:
            type: string
          example:
            - ipfs://bafybeih...
        status:
          $ref: "#/components/schemas/DisputeStatus"
        createdAt:
          type: string
          format: date-time
          example: 2024-01-15T09:00:00.000Z
        deadline:
          type: string
          format: date-time
          example: 2024-01-16T09:00:00.000Z
        resolution:
          type: string
          nullable: true
          example: null
      required:
        - id
        - filedBy
        - respondent
        - reason
        - evidence
        - status
        - createdAt
        - deadline
        - resolution
    DisputeStatus:
      type: string
      enum:
        - pending
        - under_review
        - resolved
        - dismissed
        - expired
    DisputeError:
      type: object
      properties:
        error:
          type: string
          example: NotFound
        message:
          type: string
          example: Dispute not found
      required:
        - error
        - message
    SubmitDisputeBody:
      type: object
      properties:
        filedBy:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: Stellar address of the party filing the dispute
          example: GDUKMGUGDZQK6YHYA5Z6AY2G4XDSZPSZ3SW5UN3ARVMO6QSRDWP5YLEX
        respondent:
          type: string
          pattern: ^G[A-Z2-7]{55}$
          description: Stellar address of the respondent
          example: GBVFLWXYZ6JJ7TUSU6QDJ6DOY4J5G5VHGJWSCMHL7QSAHRDEQU3EXFW2
        reason:
          type: string
          minLength: 10
          description: Reason for the dispute (minimum 10 characters)
          example: Goods delivered did not match the agreed specification
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          description: Evidence references (URIs, hashes, etc.) supporting the dispute
          example:
            - ipfs://bafybeih...
        deadlineMs:
          type: integer
          minimum: 3600000
          maximum: 2592000000
          description: Resolution deadline expressed as milliseconds from now (min 1 hour,
            max 30 days)
          example: 86400000
      required:
        - filedBy
        - respondent
        - reason
        - evidence
        - deadlineMs
    DisputeTransitionError:
      type: object
      properties:
        error:
          type: string
          example: Invalid dispute state transition
        code:
          type: string
          example: invalid_dispute_transition
        error_code:
          type: string
          example: invalid_dispute_transition
        message:
          type: string
          example: Invalid transition from "resolved" to "resolved"
      required:
        - error
        - code
        - error_code
        - message
    ResolveDisputeBody:
      type: object
      properties:
        resolution:
          type: string
          minLength: 1
          description: Resolution text describing the outcome
          example: Respondent agreed to a partial refund of 20%
      required:
        - resolution
    DismissDisputeBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: Reason the dispute is being dismissed
          example: Insufficient evidence provided
      required:
        - reason
    FlagListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlagWithOverrideResponse"
      required:
        - success
        - data
    FeatureFlagWithOverrideResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9_-]+$
          description: Unique flag identifier (slug)
          example: new-scoring-weights
        description:
          type: string
          example: Enable new scoring algorithm
        defaultEnabled:
          type: boolean
          example: false
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rollout percentage (0–100). 0 = disabled for all, 100 = enabled for
            all.
          example: 25
        createdAt:
          type: string
          format: date-time
          example: 2025-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-15T12:00:00.000Z
        override:
          $ref: "#/components/schemas/FeatureFlagOverrideResponse"
        tenantRollout:
          $ref: "#/components/schemas/FeatureFlagTenantRolloutResponse"
        effectiveEnabled:
          type: boolean
          description: Resolved enabled state for the current tenant (accounts for
            override, per-tenant rollout, global rollout, and default)
          example: true
        effectiveRolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Effective rollout percentage used for user-level sticky bucketing
            (per-tenant rollout takes precedence over global)
          example: 25
      required:
        - id
        - key
        - description
        - defaultEnabled
        - rolloutPercent
        - createdAt
        - updatedAt
        - override
        - tenantRollout
        - effectiveEnabled
        - effectiveRolloutPercent
    FeatureFlagOverrideResponse:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
          example: 5d7e4a12-0a3b-4c9d-bf82-1e2f3a4b5c6d
        flagId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tenantId:
          type: string
          example: tenant-abc
        enabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2025-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-15T12:00:00.000Z
      required:
        - id
        - flagId
        - tenantId
        - enabled
        - createdAt
        - updatedAt
      description: Per-tenant boolean override, if set
    FeatureFlagTenantRolloutResponse:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        flagId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tenantId:
          type: string
          example: tenant-abc
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rollout percentage (0–100). 0 = disabled for all, 100 = enabled for
            all.
          example: 25
        createdAt:
          type: string
          format: date-time
          example: 2025-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-15T12:00:00.000Z
      required:
        - id
        - flagId
        - tenantId
        - rolloutPercent
        - createdAt
        - updatedAt
      description: Per-tenant rollout percentage override, if set
    FlagErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Feature flag 'unknown-flag' not found
      required:
        - error
    FlagResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/FeatureFlagResponse"
      required:
        - success
        - data
    FeatureFlagResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9_-]+$
          description: Unique flag identifier (slug)
          example: new-scoring-weights
        description:
          type: string
          example: Enable new scoring algorithm
        defaultEnabled:
          type: boolean
          example: false
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rollout percentage (0–100). 0 = disabled for all, 100 = enabled for
            all.
          example: 25
        createdAt:
          type: string
          format: date-time
          example: 2025-01-01T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-15T12:00:00.000Z
      required:
        - id
        - key
        - description
        - defaultEnabled
        - rolloutPercent
        - createdAt
        - updatedAt
    CreateFlagBody:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9_-]+$
          description: Unique flag identifier (slug)
          example: new-scoring-weights
        description:
          type: string
          maxLength: 512
          default: ""
          description: Human-readable description of the flag
          example: Enable new scoring algorithm for gradual rollout
        defaultEnabled:
          type: boolean
          default: false
          description: Default enabled state when no override or rollout applies
          example: false
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Rollout percentage (0–100). 0 = disabled for all, 100 = enabled for
            all.
          example: 25
      required:
        - key
    UpdateFlagBody:
      type: object
      properties:
        description:
          type: string
          maxLength: 512
          description: New description for the flag
          example: Updated description
        defaultEnabled:
          type: boolean
          description: New default enabled state
          example: true
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rollout percentage (0–100). 0 = disabled for all, 100 = enabled for
            all.
          example: 25
    OverrideResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/FeatureFlagOverrideResponse"
      required:
        - success
        - data
    SetOverrideBody:
      type: object
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 256
          description: Tenant identifier to apply the override to
          example: tenant-abc
        enabled:
          type: boolean
          description: Whether the flag is enabled for this tenant (overrides rollout)
          example: true
      required:
        - tenantId
        - enabled
    TenantRolloutResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/FeatureFlagTenantRolloutResponse"
      required:
        - success
        - data
    SetTenantRolloutBody:
      type: object
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 256
          description: Tenant identifier to apply the per-tenant rollout to
          example: tenant-abc
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rollout percentage (0–100). 0 = disabled for all, 100 = enabled for
            all.
          example: 25
      required:
        - tenantId
        - rolloutPercent
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key sent as `Authorization: Bearer <key>`"
  parameters: {}
paths:
  /api/health:
    get:
      summary: Health check
      description: Service health status.
      tags:
        - Health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: object
                    properties:
                      gitSha:
                        type: string
                      buildTimestamp:
                        type: string
                      nodeVersion:
                        type: string
                    required:
                      - gitSha
                      - buildTimestamp
                      - nodeVersion
                required:
                  - status
                  - service
                  - version
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: object
                    properties:
                      gitSha:
                        type: string
                      buildTimestamp:
                        type: string
                      nodeVersion:
                        type: string
                    required:
                      - gitSha
                      - buildTimestamp
                      - nodeVersion
                required:
                  - status
                  - service
                  - version
  /api/version:
    get:
      summary: Build version
      description: Returns the running build's git SHA, build timestamp, and Node
        version, so support/on-call can confirm which build is deployed.
      tags:
        - Health
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /.well-known/jwks.json:
    get:
      summary: JWKS
      description: JSON Web Key Set for verifying JWT signatures.
      tags:
        - Security
      responses:
        "200":
          description: JWKS returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  nullable: true
  /api/dev/fault-injection:
    post:
      summary: Fault injection
      description: Returns a configurable HTTP error (default 500) with a structured
        JSON body. Only available when DEV_MODE is enabled (404 otherwise).
        Intended for chaos / retry testing.
      tags:
        - Dev
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "200":
          description: Simulated fault response
          content:
            application/json: {}
        "400":
          description: Validation error (invalid statusCode or message too long)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                required:
                  - error
                  - details
        "404":
          description: DEV_MODE is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/trust/{address}:
    get:
      summary: Get trust score
      description: Returns computed trust score and identity data.
      tags:
        - Trust
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: address
          in: path
      responses:
        "200":
          description: Trust data
          content:
            application/json:
              schema:
                nullable: true
        "400":
          description: Invalid address format
          content:
            application/json:
              schema:
                nullable: true
        "404":
          description: No identity record
          content:
            application/json:
              schema:
                nullable: true
  /api/trust:
    post:
      summary: Trust query (internal)
      description: Trust lookup entrypoint.
      tags:
        - Trust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              nullable: true
      responses:
        "200":
          description: Trust data
          content:
            application/json:
              schema:
                nullable: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                nullable: true
  /api/attestations/{address}:
    get:
      summary: List attestations
      description: Returns attestations for a subject address.
      tags:
        - Attestations
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: address
          in: path
      responses:
        "200":
          description: Attestations
          content:
            application/json:
              schema:
                nullable: true
  /api/attestations:
    post:
      summary: Create attestation
      description: Creates an attestation and emits events.
      tags:
        - Attestations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bondId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                attesterAddress:
                  type: string
                  minLength: 1
                subject:
                  type: string
                  minLength: 1
                value:
