        Allows different tenants to receive the flag at different rollout
        speeds. Sticky user-id bucketing (SHA-256 hash of flagKey:userId) still
        applies within the tenant's percentage window. A boolean override (if
        present) always takes precedence over this setting.
      tags:
        - Feature Flags
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z0-9_-]+$
            description: Unique flag identifier (slug)
            example: new-scoring-weights
          required: true
          description: Unique flag identifier (slug)
          name: key
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTenantRolloutBody"
      responses:
        "201":
          description: Per-tenant rollout created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRolloutResponseEnvelope"
        "400":
          description: Validation error (e.g. rolloutPercent out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
        "404":
          description: Feature flag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
  /api/admin/feature-flags/{key}/tenant-rollouts/{tenantId}:
    delete:
      summary: Remove a per-tenant rollout percentage
      description: Removes a per-tenant rollout percentage. After removal the tenant
        falls back to the global rollout percent (or defaultEnabled if that is
        also 0).
      tags:
        - Feature Flags
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z0-9_-]+$
            description: Unique flag identifier (slug)
            example: new-scoring-weights
          required: true
          description: Unique flag identifier (slug)
          name: key
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 256
            description: Tenant identifier
            example: tenant-abc
          required: true
          description: Tenant identifier
          name: tenantId
          in: path
      responses:
        "200":
          description: Per-tenant rollout removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagErrorResponse"
  /api/admin/migrations/dry-run:
    get:
      summary: Migration dry-run (GET)
      description: Previews the SQL statements that would be executed by the next
        pending database migration up.
      tags:
        - Admin Migrations
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: count
          in: query
        - schema:
            type: string
          required: false
          name: file
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: skipPreflight
          in: query
      responses:
        "200":
          description: Dry run completed successfully with pending SQL statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applied:
                        type: array
                        items:
                          type: string
                      sql:
                        type: array
                        items:
                          type: string
                      sqlText:
                        type: string
                      count:
                        type: number
                    required:
                      - applied
                      - sql
                      - sqlText
                      - count
                required:
                  - success
                  - data
        "400":
