        - schema:
            type: integer
            minimum: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          required: false
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: Paginated list of slash requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlashRequestsListResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceError"
  /api/governance/slash-requests/{id}:
