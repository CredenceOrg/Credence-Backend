                amount:
                  type: string
                  pattern: ^\d+(\.\d{1,18})?$
                transactionHash:
                  type: string
                  minLength: 1
                  maxLength: 128
                settledAt:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum:
                    - pending
                    - settled
                    - failed
              required:
